<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - DealsBack</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 6rem;
            font-weight: 800;
            color: #ff4757;
            line-height: 1;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #2f3542;
        }
        p {
            font-size: 1rem;
            color: #747d8c;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .redirect-text {
            font-weight: 600;
            color: #2f3542;
            margin-bottom: 20px;
        }
        #countdown {
            color: #ff4757;
            font-size: 1.2rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2f3542;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #1e222b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Oops! Page Missing</h2>
        <p>The deal or page you are looking for might have expired, been removed, or had its name changed.</p>
        
        <div class="redirect-text">
            Redirecting to the homepage in <span id="countdown">5</span> seconds...
        </div>

        <a href="https://dealsback.in/" class="btn">Go to Homepage Now</a>
    </div>

    <script>
        // Set the countdown time (in seconds)
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = "https://dealsback.in/";
            }
        }, 1000);
    </script>

</body>
</html>
